<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lintel · 3D Smoke</title>
    <style>html,body{color:#e8e6e1;background:#111418;height:100%;margin:0;font:13px/1.45 system-ui,sans-serif}#view{position:fixed;inset:0}#panel{background:#14181ee0;border-radius:8px;width:250px;padding:10px 12px;position:fixed;top:12px;left:12px}#panel h1{margin:0 0 6px;font-size:14px}#panel h2{color:#f0b37e;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px;font-size:11px}#panel label{cursor:pointer;align-items:center;gap:6px;margin:2px 0;display:flex}.seg{flex-wrap:wrap;gap:4px;display:flex}button,select{color:#e8e6e1;font:inherit;cursor:pointer;background:#2c333c;border:1px solid #3a424d;border-radius:5px;padding:3px 8px}button.on{background:#4a3a2a;border-color:#f0b37e}#status,#probe{color:#9aa3ad;font-variant-numeric:tabular-nums;margin-top:6px}#help{color:#f0b37e;margin-top:6px}.room-label{color:#fff;pointer-events:none;white-space:nowrap;background:#0000008c;border-radius:4px;padding:1px 6px;font-size:12px}.room-label.fire{background:#c84614d9}</style>
    <script type="module" crossorigin src="/ultramarine-2026-10/assets/index-Cu-8LNlg.js"></script>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel">
      <h1>Lintel · 3D smoke</h1>

      <h2>Fire 起火</h2>
      <div class="seg">
        <select id="room"></select>
        <button id="random">Random 随机</button>
      </div>
      <div class="seg" style="margin-top:4px">
        <button id="run">Pause 暂停</button>
        <button id="reset">Reset 重置</button>
      </div>

      <h2>View 滤镜</h2>
      <div class="seg">
        <button data-mode="smoke">Eyes 肉眼</button>
        <button data-mode="heat">Thermal 热成像</button>
      </div>
      <label><input type="checkbox" id="dress" checked> Floor lines &amp; lights 地板线与光照</label>
      <label><input type="checkbox" id="detail" checked> Smoke detail 烟的细节</label>
      <label>Thin smoke 稀烟浓度 <input type="range" id="thin" min="0.3" max="1" step="0.05" value="0.6"> <span id="thinVal">0.60</span></label>
      <label><input type="checkbox" id="wind" checked> Wind streaks 风</label>
      <label><input type="checkbox" id="roof"> Roof 屋顶</label>
      <label><input type="checkbox" id="upperFloor"> Upper floor 二楼地板</label>
      <label><input type="checkbox" id="sealUpstairs" checked> Seal upstairs 封住二楼</label>

      <div id="help"></div>
      <div id="probe"></div>
      <div id="status">Loading…</div>
    </div>
  </body>
</html>
