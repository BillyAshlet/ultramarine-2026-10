<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duplex fire</title>
<style>
  :root { color-scheme: dark; --panel: rgba(16, 19, 23, 0.9); --text: #e6e6ea; --dim: #9a9aa6; --accent: #ff6a1a; }
  html, body { margin: 0; height: 100%; background: #111418; color: var(--text); font: 13px/1.45 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #view canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: 310px; max-width: calc(100vw - 24px); max-height: calc(100vh - 42px); overflow-y: auto; box-sizing: border-box; background: var(--panel); border: 1px solid #2a3038; border-radius: 8px; padding: 11px 12px; z-index: 8; }
  h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: 0.01em; }
  .row { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0; align-items: center; }
  button, select { background: #2a2d36; color: var(--text); border: 0; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button.on { background: #4a6cf7; }
  #fire { color: var(--accent); font-weight: 600; font-size: 12.5px; margin-bottom: 4px; }
  .dim { color: var(--dim); font-size: 11.5px; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 4px; }
  label.layer { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; }
  details.drawer { border: 1px solid #262b33; border-radius: 6px; padding: 5px 8px; margin: 7px 0; background: rgba(24, 28, 34, 0.55); }
  details.drawer summary { cursor: pointer; font-size: 12px; color: #b8bec9; user-select: none; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.drawer summary::after { content: '▸'; color: var(--dim); }
  details.drawer[open] summary::after { content: '▾'; }
  /* Beside the panel, so it never covers it. */
  #legend { position: fixed; top: 12px; left: 332px; background: var(--panel); border: 1px solid #2a3038; border-radius: 8px; padding: 10px 12px; font-size: 11px; z-index: 7; }
  #legend[hidden] { display: none; }
  #legend .body { display: flex; gap: 6px; height: 260px; margin-top: 6px; }
  #legendBar { width: 14px; height: 100%; border-radius: 2px; }
  #legendTicks { position: relative; width: 52px; }
  #legendTicks span { position: absolute; left: 0; transform: translateY(-50%); white-space: nowrap; }
  @media (max-width: 700px) { #legend { top: 8px; left: 8px; } }
  #status { position: fixed; bottom: 10px; left: 12px; right: 12px; color: var(--dim); font-size: 11.5px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); }
  @media (max-width: 700px) { #panel { top: auto; bottom: 34px; left: 8px; right: 8px; width: auto; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/OrbitControls.js": "./vendor/OrbitControls.js" } }</script>
</head>
<body>
<div id="view"></div>
<div id="loading">Loading the house 加载房子…</div>
<div id="panel">
  <h1>NIBS Duplex · Fire CAE 火灾耦合分析</h1>
  <div id="fire"></div>
  <div class="row">
    <button id="startFire" style="background:#d95b16;color:#fff;font-weight:600">Start 起火</button>
    <button id="run">Run 继续</button>
    <button id="ffwd" title="Fast-forward 30 simulated seconds 快进 30 秒">+30s</button>
    <button id="restart">Reset 重置</button>
  </div>
  <div class="row">
    <span class="dim">Speed</span>
    <button data-speed="1" class="on">1×</button>
    <button data-speed="4">4×</button>
    <button data-speed="12">12×</button>
    <button data-mode="smoke" class="on">Smoke 烟</button>
    <button data-mode="heat">Heat 热</button>
    <label style="display:none"><input type="checkbox" id="furniture" checked></label>
  </div>
  <div class="row">
    <button data-level="all" class="on">Both</button>
    <button data-level="1">1F 一层</button>
    <button data-level="2">2F 二层</button>
    <label style="font-size:12px"><input type="checkbox" id="roof"> Roof</label>
  </div>
  <details class="drawer" id="displayDrawer">
    <summary>Layers &amp; Display 显示与透视</summary>
    <div class="row" style="margin-top:8px">
      <label style="flex:1">Walls 墙体 <span id="opacityVal"></span><br><input type="range" id="opacity" min="0.05" max="1" step="0.05" value="1" style="width:100%"></label>
    </div>
    <div class="row">
      <label style="flex:1">Furniture 家具 <span id="furnitureOpacityVal"></span><br><input type="range" id="furnitureOpacity" min="0" max="1" step="0.05" value="1" style="width:100%"></label>
    </div>
    <div class="row">
      <label style="flex:1">Smoke 烟浓淡 <span id="smokeOpacityVal"></span><br><input type="range" id="smokeOpacity" min="0.1" max="3" step="0.05" value="1" style="width:100%"></label>
    </div>
    <div class="row">
      <label class="layer"><input type="checkbox" id="show-gas" checked><span class="swatch" style="background:#ffc400"></span>Gas 气</label>
      <label class="layer"><input type="checkbox" id="show-electrical" checked><span class="swatch" style="background:#50dc78"></span>Elec 电</label>
      <label class="layer"><input type="checkbox" id="show-water" checked><span class="swatch" style="background:#3c8cff"></span>Water 水</label>
      <label class="layer"><input type="checkbox" id="show-heating" checked><span class="swatch" style="background:#e63ca0"></span>Heat 暖</label>
    </div>
    <div class="row">
      <label style="flex:1">Pipes 管线透视 <span id="pipeOpacityVal"></span><br><input type="range" id="pipeOpacity" min="0" max="1" step="0.05" value="0.9" style="width:100%"></label>
    </div>
    <div class="dim">点「Start 起火」烧客厅沙发，或右下角「Ignite 点火」自选起火点；双击门开关，单击构件看卡片。</div>
  </details>
  <div id="leftCharts"></div>
  <div id="leftTimeline"></div>
</div>
<div id="legend" hidden>
  <div>Air 空气温度</div>
  <div class="body"><canvas id="legendBar" width="14" height="260"></canvas><div id="legendTicks"></div></div>
  <div class="dim" style="max-width:90px;margin-top:6px">Not to scale: low heat is drawn stronger.<br>刻度不均匀：低温画得更显眼。</div>
</div>
<div id="status"></div>
<script type="module">
  import('./src/main.js')
    .then(() => document.getElementById('loading').remove())
    .catch((e) => { document.getElementById('loading').textContent = 'Error 出错: ' + e.message; console.error(e); });
</script>
</body>
</html>
